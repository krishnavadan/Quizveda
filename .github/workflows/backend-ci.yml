name: Backend CI

on:
  pull_request:
    paths:
      - "backend/**"
      - "content/schema/**"
      - "content/examples/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "content/schema/**"
      - "content/examples/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check app migrations
      - name: Unit tests
        run: pytest -q
      - name: Alembic offline SQL smoke test
        run: alembic upgrade head --sql
      - name: Validate sample content pack
        run: python -m app.modules.content.cli ../content/examples/sample-pack --schema-dir ../content/schema
